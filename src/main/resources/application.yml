spring:
  application:
    name: pdv-restaurante
  datasource:
    url: jdbc:h2:file:./data/pdv
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é versionado pelo Flyway (db/migration); o Hibernate só confere se bate com as entidades
      ddl-auto: validate
  h2:
    console:
      enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger

pdv:
  # Carrega cardápio, estoque e mesas de exemplo quando o banco está vazio
  seed: true
  # Serviço (gorjeta) padrão, em %, aplicado ao abrir uma comanda
  servico-padrao: 10
  # Fuso do restaurante: define onde começa e termina o "dia" nos relatórios (independe do fuso da máquina/contêiner)
  fuso: America/Sao_Paulo
  # Usuários do sistema (HTTP Basic). As senhas abaixo são só de demonstração:
  # em uso real, defina as variáveis PDV_SENHA_* no ambiente.
  seguranca:
    usuarios:
      - { login: garcom, senha: "${PDV_SENHA_GARCOM:garcom123}", perfil: GARCOM }
      - { login: cozinha, senha: "${PDV_SENHA_COZINHA:cozinha123}", perfil: COZINHA }
      - { login: caixa, senha: "${PDV_SENHA_CAIXA:caixa123}", perfil: CAIXA }
      - { login: gerente, senha: "${PDV_SENHA_GERENTE:gerente123}", perfil: GERENTE }

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pdv}
    username: ${DB_USER:pdv}
    password: ${DB_PASSWORD:pdv}
  h2:
    console:
      enabled: false
