spring:
  application:
    name: pdv-restaurante
  datasource:
    url: jdbc:h2:file:./data/pdv
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger

pdv:
  # Carrega cardápio, estoque e mesas de exemplo quando o banco está vazio
  seed: true
  # Serviço (gorjeta) padrão, em %, aplicado ao abrir uma comanda
  servico-padrao: 10
  # Fuso do restaurante: define onde começa e termina o "dia" nos relatórios (independe do fuso da máquina/contêiner)
  fuso: America/Sao_Paulo

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pdv}
    username: ${DB_USER:pdv}
    password: ${DB_PASSWORD:pdv}
  h2:
    console:
      enabled: false
